[package]
name = "kryptos"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Luis Schwab <dev@luisschwab.net>"]
description = "A desktop dashboard and wallet viewer for the Kryptos shielded blockchain"
repository = "https://github.com/zkmagnus/Kryptos-gui"
readme = "README.md"
license = "MIT"
keywords = ["kryptos", "wallet", "desktop", "privacy", "blockchain"]

[[bin]]
name = "kryptos"
path = "src/main.rs"

[features]
hot-reloading = ["iced/hot"]

[package.metadata.bundle]
name = "Kryptos"

[dependencies]
dirs = "=6.0.0"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "x11", "wayland", "tokio"] }
open = "=5.3.5"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
toml = "=1.1.2"
